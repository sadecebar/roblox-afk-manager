<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
  <title id="t">Roblox AFK Manager</title>
  <desc id="d">Illustration of the dashboard: six client cards with live previews and session status, one flagged as disconnected.</desc>
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#9D8CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9D8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#5FD99B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5FD99B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EEEEF4" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2163"/><stop offset="1" stop-color="#7B5CD6"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3B4A"/><stop offset="1" stop-color="#2FA7A0"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A1E3A"/><stop offset="1" stop-color="#F08A5D"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13244F"/><stop offset="1" stop-color="#4C8DF0"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1A22"/><stop offset="1" stop-color="#2A2A36"/></linearGradient>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173A22"/><stop offset="1" stop-color="#6CCB7A"/></linearGradient>
    <clipPath id="p"><rect width="176" height="96" rx="7"/></clipPath>
  </defs>

  <rect width="1280" height="480" rx="24" fill="#07070A"/>
  <rect width="1280" height="480" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="480" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="480" rx="24" fill="url(#glow2)"/>

  <!-- Brand -->
  <g transform="translate(72 112)">
    <rect width="68" height="68" rx="20" fill="#9D8CFF"/>
    <circle cx="34" cy="34" r="17" fill="#0D0B1A"/>
    <circle cx="42" cy="27" r="14" fill="#9D8CFF"/>
  </g>
  <g font-family="Segoe UI Variable Display, Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="72" y="236" font-size="22" font-weight="600" fill="#9A9AAC">Roblox</text>
    <text x="70" y="292" font-size="56" font-weight="700" fill="#EEEEF4" letter-spacing="-1"><tspan fill="#9D8CFF">AFK</tspan> Manager</text>
    <text x="72" y="336" font-size="21" fill="#9A9AAC">Every client on one quiet, black screen.</text>
  </g>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(72 366)">
      <rect width="168" height="30" rx="15" fill="#16161E"/>
      <circle cx="18" cy="15" r="4.5" fill="#FF7470"/>
      <text x="30" y="20" fill="#FF7470">1 needs attention</text>
    </g>
    <g transform="translate(250 366)">
      <rect width="96" height="30" rx="15" fill="#16161E"/>
      <text x="16" y="20" fill="#EEEEF4">4 <tspan fill="#9A9AAC" font-weight="400">joined</tspan></text>
    </g>
    <g transform="translate(356 366)">
      <rect width="132" height="30" rx="15" fill="#16161E"/>
      <text x="16" y="20" fill="#EEEEF4">3.03 GB <tspan fill="#9A9AAC" font-weight="400">RAM</tspan></text>
    </g>
  </g>

  <!-- Mini dashboard -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <!-- Card template: 186 x 176 -->
    <g transform="translate(626 56)">
      <rect width="186" height="176" rx="12" fill="#101016" stroke="#22222C"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s1)"/>
        <circle cx="136" cy="24" r="10" fill="#EEEEF4" fill-opacity="0.85"/>
        <path d="M0 96 V66 H28 V56 H60 V70 H96 V48 H124 V62 H176 V96 Z" fill="#1A1440"/>
        <path d="M0 96 V80 H40 V74 H88 V84 H140 V76 H176 V96 Z" fill="#120E2E"/>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#5FD99B" stroke="#101016" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">NightOwl</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Moon Mining · <tspan fill="#EEEEF4" font-weight="600">6h 12m</tspan></text>
      <rect x="10" y="148" width="72" height="20" rx="10" fill="#5FD99B" fill-opacity="0.12"/><circle cx="21" cy="158" r="3" fill="#5FD99B"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#5FD99B">Joined</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 612 MB</text>
    </g>
    <g transform="translate(826 56)">
      <rect width="186" height="176" rx="12" fill="#101016" stroke="#22222C"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s2)"/>
        <path d="M0 96 V60 H20 V52 H52 V64 H84 V44 H108 V58 H150 V50 H176 V96 Z" fill="#0A2A33"/>
        <rect x="70" y="30" width="14" height="14" fill="#EEEEF4" fill-opacity="0.25"/>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#5FD99B" stroke="#101016" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">IdleKing</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Lantern Defense · <tspan fill="#EEEEF4" font-weight="600">5h 48m</tspan></text>
      <rect x="10" y="148" width="72" height="20" rx="10" fill="#5FD99B" fill-opacity="0.12"/><circle cx="21" cy="158" r="3" fill="#5FD99B"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#5FD99B">Joined</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 588 MB</text>
    </g>
    <g transform="translate(1026 56)">
      <rect width="186" height="176" rx="12" fill="#101016" stroke="#22222C"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s3)"/>
        <circle cx="40" cy="58" r="16" fill="#FFD29A" fill-opacity="0.9"/>
        <path d="M0 96 V70 H36 V62 H70 V74 H112 V58 H144 V68 H176 V96 Z" fill="#3A1630"/>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#5FD99B" stroke="#101016" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">AwayAce</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Starfish Bay · <tspan fill="#EEEEF4" font-weight="600">4h 03m</tspan></text>
      <rect x="10" y="148" width="72" height="20" rx="10" fill="#5FD99B" fill-opacity="0.12"/><circle cx="21" cy="158" r="3" fill="#5FD99B"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#5FD99B">Joined</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 640 MB</text>
    </g>

    <g transform="translate(626 246)">
      <rect width="186" height="176" rx="12" fill="#101016" stroke="#22222C"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s4)"/>
        <path d="M0 96 V64 H44 V50 H76 V66 H120 V56 H176 V96 Z" fill="#0C1838"/>
        <rect x="132" y="22" width="20" height="20" fill="#EEEEF4" fill-opacity="0.2"/>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#7DC3FF" stroke="#101016" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">Dreamer</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Cloud Obby</text>
      <rect x="10" y="148" width="74" height="20" rx="10" fill="#7DC3FF" fill-opacity="0.12"/><circle cx="21" cy="158" r="3" fill="#7DC3FF"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#7DC3FF">Joining</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 402 MB</text>
    </g>
    <g transform="translate(826 246)">
      <rect width="186" height="176" rx="12" fill="#160F13" stroke="#FF7470" stroke-opacity="0.6"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s5)"/>
        <text x="88" y="54" font-size="11" fill="#686878" text-anchor="middle">Disconnected</text>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#FF7470" stroke="#160F13" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">Snoozer</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Moon Mining</text>
      <rect x="10" y="148" width="98" height="20" rx="10" fill="#FF7470" fill-opacity="0.14"/><circle cx="21" cy="158" r="3" fill="#FF7470"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#FF7470">Disconnected</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 211 MB</text>
    </g>
    <g transform="translate(1026 246)">
      <rect width="186" height="176" rx="12" fill="#101016" stroke="#9D8CFF"/>
      <g transform="translate(5 5)" clip-path="url(#p)">
        <rect width="176" height="96" fill="url(#s6)"/>
        <path d="M0 96 V58 H30 V66 H64 V52 H100 V62 H140 V54 H176 V96 Z" fill="#0F2A17"/>
        <rect x="100" y="34" width="12" height="18" fill="#0F2A17"/><circle cx="106" cy="30" r="9" fill="#0F2A17"/>
      </g>
      <circle cx="20" cy="124" r="10" fill="#1E1E28"/><circle cx="27" cy="131" r="4" fill="#5FD99B" stroke="#101016" stroke-width="2"/>
      <text x="38" y="121" font-size="13" font-weight="600" fill="#EEEEF4">Moonlit</text>
      <text x="38" y="136" font-size="10.5" fill="#9A9AAC">Garden Tycoon · <tspan fill="#EEEEF4" font-weight="600">2h 27m</tspan></text>
      <rect x="10" y="148" width="72" height="20" rx="10" fill="#5FD99B" fill-opacity="0.12"/><circle cx="21" cy="158" r="3" fill="#5FD99B"/>
      <text x="29" y="162" font-size="10.5" font-weight="600" fill="#5FD99B">Joined</text>
      <text x="176" y="162" font-size="10" fill="#686878" text-anchor="end">RAM 574 MB</text>
    </g>
  </g>
</svg>
